# 发布 npm CLI：@zhhoceanfly/oceanview
#
# 认证：npm Trusted Publishing（OIDC，无 NPM_TOKEN、无浏览器 MFA）
#   1. https://www.npmjs.com/package/@zhhoceanfly/oceanview → Settings → Trusted Publisher
#      选 GitHub Actions，填：用户 zhhOceanfly / 仓库 OceanView /
#      Workflow filename = publish-npm-cli.yml / Allowed actions 勾 npm publish
#   2. 新建的 Trusted Publisher 必须在 2 天内成功发布一次，否则失效需重建
#   3. 首次发布例外：包在 npm 上还不存在时无法配置 Trusted Publisher，
#      必须先本机用 token 发一次（见 PUBLISH.md），之后才能全交给 CI
#
# 触发（与 Open VSX / DBX 分开，勿共用 tag）：
#   - 手动：Actions → Publish npm CLI → Run workflow
#   - Tag：git tag cli-v0.1.1 && git push origin cli-v0.1.1
#
# 发布前先升 packages/cli/package.json 的 version（同版本不能重复发）。

name: Publish npm CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write # Trusted Publishing 换取短期 token 必须

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted Publishing 只支持 GitHub 托管 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 Node >= 22.14；22 分支会取最新 22.x
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # 发布构建不要用依赖缓存
          package-manager-cache: false

      - name: Ensure npm CLI supports trusted publishing
        run: |
          node -v
          npm -v
          npm install -g npm@^11.5.1
          npm -v

      - name: Install dependencies
        run: npm ci

      # packages/cli 是独立包（有自己的 package-lock），根目录 npm ci 不会装它的
      # 依赖，缺 ws / @types/ws 会让 tsc 报 TS2307（build-cli 里也有自动兜底）
      - name: Install CLI dependencies
        run: npm ci --prefix packages/cli --include=dev

      - name: Build CLI
        run: npm run build:cli

      # 该版本已发布时跳过，避免 tag 重跑直接失败
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CLI version: $VERSION"
          if npm view "@zhhoceanfly/oceanview@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "已在 npm 上，跳过发布。"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # 不传任何 token：id-token: write + npm >= 11.5.1 会自动走 OIDC 并生成 provenance
      - name: Publish @zhhoceanfly/oceanview
        if: steps.version.outputs.already_published == 'false'
        run: npm publish ./packages/cli --access public --registry https://registry.npmjs.org/
